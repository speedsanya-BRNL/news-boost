<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главные Новости — Мир и Регионы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-top">
            <h1>ГЛАВНЫЕ НОВОСТИ</h1>
            <div>
                <button class="theme-toggle" id="refresh-btn" style="margin-right: 6px;">🔄 Обновить</button>
                <button class="theme-toggle" id="theme-btn">🌓 Тема</button>
            </div>
        </div>
        <nav class="region-nav" id="region-buttons"></nav>
    </header>

    <div class="container">
        <div class="meta-bar">
            <h2 class="section-heading" id="current-title">Картина дня по всем рубрикам</h2>
            <span class="update-time" id="last-updated">Загрузка...</span>
        </div>
        <div class="news-grid" id="news-container">
            <p>Собираем свежие новости и переводим заголовки...</p>
        </div>
    </div>

    <footer>
        Новости обновляются автоматически при открытии страницы
    </footer>

    <script>
        // =========================================================================
        // НАСТРОЙКА РУБРИК И ИСТОЧНИКОВ
        // Чтобы добавить новую рубрику — просто скопируйте любой блок по образцу!
        // =========================================================================
        const SOURCES = {
            "Мир": [
                { name: "ТАСС", url: "https://tass.ru" },
                { name: "BBC World", url: "https://bbci.co.uk" }
            ],
            "Европа": [
                { name: "Euronews", url: "https://euronews.com" }
            ],
            "США": [
                { name: "NPR News", url: "https://npr.org" },
                { name: "Голос Америки", url: "https://golosameriki.com" }
            ],
            "Азия": [
                { name: "Channel NewsAsia", url: "https://channelnewsasia.com" }
            ],
            "Китай": [
                { name: "South China Morning Post", url: "https://scmp.com" }
            ],
            "Таиланд": [
                { name: "Bangkok Post", url: "https://bangkokpost.com" },
                { name: "The Pattaya News", url: "https://thepattayanews.com" }
            ],
            "Россия": [
                { name: "Интерфакс", url: "https://interfax.ru" },
                { name: "Лента.ру", url: "https://lenta.ru" }
            ],
            "Барнаул": [
                { name: "Толк", url: "https://tolknews.ru" },
                { name: "Амител", url: "https://amic.ru" }
            ]
        };

        let allNews = [];
        let currentRegion = 'Все';
        const container = document.getElementById('news-container');
        const heading = document.getElementById('current-title');
        const updatedSpan = document.getElementById('last-updated');
        const navContainer = document.getElementById('region-buttons');
        const themeBtn = document.getElementById('theme-btn');
        const refreshBtn = document.getElementById('refresh-btn');

        // Тема День / Ночь
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
        }
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
        });

        // Автоперевод иностранных заголовков на русский через бесплатный API
        async function translateToRu(text) {
            if (!text || /[а-яА-ЯёЁ]/.test(text)) return text;
            try {
                const res = await fetch(`https://googleapis.com{encodeURIComponent(text)}`);
                const data = await res.json();
                return data[0].map(item => item[0]).join('');
            } catch (e) {
                return text;
            }
        }

        // Очистка HTML-тегов из описания
        function stripHtml(html) {
            const tmp = document.createElement('div');
            tmp.innerHTML = html || '';
            const text = tmp.textContent || tmp.innerText || '';
            return text.length > 170 ? text.slice(0, 170) + '...' : text;
        }

        // Создание кнопок вкладок
        function buildMenu() {
            navContainer.innerHTML = '';
            const categories = ['Все', ...Object.keys(SOURCES)];

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'region-btn' + (cat === currentRegion ? ' active' : '');
                btn.textContent = cat === 'Все' ? 'Главное' : cat;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentRegion = cat;
                    renderNews();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
                navContainer.appendChild(btn);
            });
        }

        // Отрисовка карточек
        function renderNews() {
            container.innerHTML = '';
            let filtered = [];

            if (currentRegion === 'Все') {
                heading.textContent = 'Картина дня по всем рубрикам';
                Object.keys(SOURCES).forEach(cat => {
                    const items = allNews.filter(n => n.region === cat).slice(0, 1);
                    filtered.push(...items);
                });
            } else {
                heading.textContent = currentRegion;
                filtered = allNews.filter(n => n.region === currentRegion).slice(0, 9);
            }

            if (filtered.length === 0) {
                container.innerHTML = '<p>Загружаем новости для этого раздела или источник временно недоступен...</p>';
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('article');
                card.className = 'news-card';
                const imgHtml = item.image
                    ? `<a href="${item.link}" target="_blank" rel="noopener"><img src="${item.image}" alt="" class="card-img" loading="lazy" onerror="this.parentElement.style.display='none'"></a>`
                    : '';

                card.innerHTML = `
                    ${imgHtml}
                    <div class="card-body">
                        <div>
                            <div class="card-top">
                                <span class="badge">${item.region}</span>
                                <span class="source-name">${item.source}</span>
                            </div>
                            <h2><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></h2>
                            <p>${item.description}</p>
                        </div>
                        <div class="card-footer">
                            <span>${item.date}</span>
                            <a href="${item.link}" target="_blank" rel="noopener" class="read-link">Читать &rarr;</a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Загрузка новостей через открытый конвертер RSS -> JSON
        async function loadAllNews() {
            updatedSpan.textContent = 'Обновляем ленту...';
            allNews = [];
            const tasks = [];

            for (const [region, feeds] of Object.entries(SOURCES)) {
                for (const feed of feeds) {
                    const apiUrl = `https://rss2json.com{encodeURIComponent(feed.url)}`;
                    const task = fetch(apiUrl)
                        .then(r => r.json())
                        .then(async data => {
                            if (data.status === 'ok' && data.items) {
                                const topItems = data.items.slice(0, 5);
                                for (const item of topItems) {
                                    const titleRu = await translateToRu(item.title);
                                    const descRu = await translateToRu(stripHtml(item.description));
                                    const img = item.thumbnail || (item.enclosure && item.enclosure.link) || '';
                                    const dateStr = item.pubDate ? item.pubDate.slice(0, 16) : '';

                                    allNews.push({
                                        region: region,
                                        source: feed.name,
                                        title: titleRu,
                                        link: item.link,
                                        date: dateStr,
                                        description: descRu,
                                        image: img
                                    });
                                }
                                renderNews(); // Отрисовываем по мере поступления
                            }
                        })
                        .catch(err => console.log('Ошибка источника:', feed.name));
                    tasks.push(task);
                }
            }

            await Promise.allSettled(tasks);
            const now = new Date();
            updatedSpan.textContent = 'Обновлено: ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        refreshBtn.addEventListener('click', loadAllNews);

        buildMenu();
