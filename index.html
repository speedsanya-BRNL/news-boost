<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главные Новости — Мир и Регионы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <h1>ГЛАВНЫЕ НОВОСТИ</h1>
            <button class="theme-toggle" id="theme-btn">🌓 Сменить тему</button>
        </div>
        <nav class="region-nav" id="region-buttons"></nav>
    </header>
    <div class="container">
        <div class="meta-bar">
            <h2 class="section-heading" id="current-title">Картина дня</h2>
            <span class="update-time" id="last-updated"></span>
        </div>
        <div class="news-grid" id="news-container"></div>
    </div>
    <footer>Автоматическое обновление каждые 2 часа</footer>

    <script>
        let allNews = [], allCategories = [], currentRegion = "Все";
        const container = document.getElementById("news-container"), heading = document.getElementById("current-title");
        const updatedSpan = document.getElementById("last-updated"), navContainer = document.getElementById("region-buttons");

        if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark-theme");
        document.getElementById("theme-btn").onclick = () => {
            document.body.classList.toggle("dark-theme");
            localStorage.setItem("theme", document.body.classList.contains("dark-theme") ? "dark" : "light");
        };

        function buildMenu() {
            navContainer.innerHTML = "";
            ["Все", ...allCategories].forEach(tab => {
                const btn = document.createElement("button");
                btn.className = "region-btn" + (tab === currentRegion ? " active" : "");
                btn.textContent = tab === "Все" ? "Главное" : tab;
                btn.onclick = () => {
                    document.querySelectorAll(".region-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    currentRegion = tab;
                    renderNews();
                    window.scrollTo({ top: 0, behavior: "smooth" });
                };
                navContainer.appendChild(btn);
            });
        }

        function renderNews() {
            container.innerHTML = "";
            let list = currentRegion === "Все"
                ? allCategories.flatMap(cat => allNews.filter(n => n.region === cat).slice(0, 1))
                : allNews.filter(n => n.region === currentRegion).slice(0, 9);
            heading.textContent = currentRegion === "Все" ? "Картина дня по всем рубрикам" : currentRegion;

            if (!list.length) {
                container.innerHTML = "<p>Запустите «Обновление новостей» во вкладке Actions на GitHub.</p>";
                return;
            }

            list.forEach(item => {
                const card = document.createElement("article");
                card.className = "news-card";
                const imgTag = item.image ? `<a href="${item.link}" target="_blank" rel="noopener"><img src="${item.image}" class="card-img" loading="lazy" onerror="this.parentElement.style.display='none'"></a>` : "";
                card.innerHTML = `${imgTag}<div class="card-body"><div><div class="card-top"><span class="badge">${item.region}</span><span class="source-name">${item.source}</span></div><h2><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></h2><p>${item.description}</p></div><div class="card-footer"><span>${item.date}</span><a href="${item.link}" target="_blank" rel="noopener" class="read-link">Читать &rarr;</a></div></div>`;
                container.appendChild(card);
            });
        }

        fetch("news.json?t=" + Date.now())
            .then(r => r.json())
            .then(data => {
                if (data.updated) updatedSpan.textContent = "Обновлено: " + data.updated;
                allNews = data.articles || [];
                allCategories = data.categories || ["Мир", "Европа", "США", "Азия", "Китай", "Таиланд", "Россия", "Барнаул"];
                buildMenu();
                renderNews();
            });
    </script>
</body>
</html>
