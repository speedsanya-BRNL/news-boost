<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главные Новости</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-top">
            <h1>ГЛАВНЫЕ НОВОСТИ</h1>
            <div>
                <button class="theme-toggle" id="refresh-btn">🔄 Обновить</button>
                <button class="theme-toggle" id="theme-btn">🌓 Тема</button>
            </div>
        </div>
        <nav class="region-nav" id="region-buttons"></nav>
    </header>

    <div class="container">
        <div class="meta-bar">
            <h2 class="section-heading" id="current-title">Картина дня</h2>
            <span class="update-time" id="last-updated"></span>
        </div>
        <div class="news-grid" id="news-container"></div>
    </div>

    <footer>
        Автоматическая лента новостей
    </footer>

    <script>
        const SOURCES = {
            "Мир": [
                { name: "ТАСС", url: "https://tass.ru" },
                { name: "BBC", url: "https://bbci.co.uk" }
            ],
            "Европа": [
                { name: "Euronews", url: "https://euronews.com" }
            ],
            "США": [
                { name: "NPR", url: "https://npr.org" }
            ],
            "Азия": [
                { name: "CNA", url: "https://channelnewsasia.com" }
            ],
            "Китай": [
                { name: "SCMP", url: "https://scmp.com" }
            ],
            "Таиланд": [
                { name: "Bangkok Post", url: "https://bangkokpost.com" },
                { name: "Pattaya News", url: "https://thepattayanews.com" }
            ],
            "Россия": [
                { name: "Лента.ру", url: "https://lenta.ru" }
            ],
            "Барнаул": [
                { name: "Толк", url: "https://tolknews.ru" },
                { name: "Амител", url: "https://amic.ru" }
            ]
        };

        let allNews = [];
        let currentRegion = "Все";

        const container = document.getElementById("news-container");
        const heading = document.getElementById("current-title");
        const updatedSpan = document.getElementById("last-updated");
        const navContainer = document.getElementById("region-buttons");

        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-theme");
        }
        document.getElementById("theme-btn").onclick = () => {
            document.body.classList.toggle("dark-theme");
            localStorage.setItem("theme", document.body.classList.contains("dark-theme") ? "dark" : "light");
        };

        function buildMenu() {
            navContainer.innerHTML = "";
            const tabs = ["Все", ...Object.keys(SOURCES)];
            tabs.forEach(tab => {
                const btn = document.createElement("button");
                btn.className = "region-btn" + (tab === currentRegion ? " active" : "");
                btn.textContent = tab === "Все" ? "Главное" : tab;
                btn.onclick = () => {
                    document.querySelectorAll(".region-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    currentRegion = tab;
                    renderNews();
                    window.scrollTo({ top: 0, behavior: "smooth" });
                };
                navContainer.appendChild(btn);
            });
        }

        function cleanText(html) {
            const div = document.createElement("div");
            div.innerHTML = html || "";
            const txt = (div.textContent || "").trim();
            return txt.length > 160 ? txt.slice(0, 160) + "..." : txt;
        }

        async function translateRu(text) {
            if (!text || /[а-яА-ЯёЁ]/.test(text)) return text;
            try {
                const r = await fetch("https://googleapis.com" + encodeURIComponent(text));
                const d = await r.json();
                return d.map(x => x).join("");
            } catch {
                return text;
            }
        }

        function renderNews() {
            container.innerHTML = "";
            let list = [];
            if (currentRegion === "Все") {
                heading.textContent = "Картина дня по всем рубрикам";
                Object.keys(SOURCES).forEach(cat => {
                    list.push(...allNews.filter(n => n.region === cat).slice(0, 1));
                });
            } else {
                heading.textContent = currentRegion;
                list = allNews.filter(n => n.region === currentRegion).slice(0, 9);
            }

            if (list.length === 0) {
                container.innerHTML = "<p>Загружаем новости для этой рубрики...</p>";
                return;
            }

            list.forEach(item => {
                const card = document.createElement("article");
                card.className = "news-card";
                const imgTag = item.image
                    ? `<a href="${item.link}" target="_blank" rel="noopener"><img src="${item.image}" class="card-img" loading="lazy" onerror="this.parentElement.style.display='none'"></a>`
                    : "";

                card.innerHTML = `
                    ${imgTag}
                    <div class="card-body">
                        <div>
                            <div class="card-top">
                                <span class="badge">${item.region}</span>
                                <span class="source-name">${item.source}</span>
                            </div>
                            <h2><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></h2>
                            <p>${item.description}</p>
                        </div>
                        <div class="card-footer">
                            <span>${item.date}</span>
                            <a href="${item.link}" target="_blank" rel="noopener" class="read-link">Читать &rarr;</a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function fetchFeed(region, feed) {
            try {
                const res = await fetch("https://allorigins.win" + encodeURIComponent(feed.url));
                const json = await res.json();
                if (!json.contents) return;

                const doc = new DOMParser().parseFromString(json.contents, "text/xml");
                const items = Array.from(doc.querySelectorAll("item")).slice(0, 5);

                for (const el of items) {
                    const rawTitle = el.querySelector("title")?.textContent?.trim() || "";
                    if (!rawTitle) continue;
                    const link = el.querySelector("link")?.textContent?.trim() || "#";
                    const rawDesc = cleanText(el.querySelector("description")?.textContent || "");
                    const pubDate = (el.querySelector("pubDate")?.textContent || "").slice(0, 16);

                    let img = "";
                    const enc = el.querySelector("enclosure");
                    if (enc && enc.getAttribute("url")) img = enc.getAttribute("url");
                    if (!img) {
                        const media = el.getElementsByTagName("media:content") || el.getElementsByTagName("media:thumbnail");
                        if (media && media.getAttribute("url")) img = media.getAttribute("url");
                    }
                    if (!img) {
                        const m = (el.querySelector("description")?.textContent || "").match(/<img[^>]+src=["']([^"']+)["']/i);
                        if (m) img = m;
                    }

                    const titleRu = await translateRu(rawTitle);
                    const descRu = await translateRu(rawDesc);

                    allNews.push({
                        region,
                        source: feed.name,
                        title: titleRu,
                        link,
                        date: pubDate,
                        description: descRu,
                        image: img
                    });
                }
                renderNews();
            } catch (e) {
                console.log("Ошибка:", feed.name);
            }
        }

        async function loadAll() {
            updatedSpan.textContent = "Загрузка...";
            allNews = [];
            buildMenu();
            renderNews();

            const jobs = [];
            for (const [region, feeds] of Object.entries(SOURCES)) {
                for (const feed of feeds) {
                    jobs.push(fetchFeed(region, feed));
                }
            }
            await Promise.allSettled(jobs);
            updatedSpan.textContent = "Обновлено: " + new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
        }

        document.getElementById("refresh-btn").onclick = loadAll;
        loadAll();
    </script>
</body>
</html>
